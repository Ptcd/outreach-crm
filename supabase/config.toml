[functions.send-openers]
verify_jwt = false

[functions.opener-status]
verify_jwt = false

[functions.reply-agent]
verify_jwt = false

# Called by the app with the signed-in user's token; the function checks the owner role itself.
[functions.reply-send]
verify_jwt = true

# Twilio's incoming-message webhook; the function checks X-Twilio-Signature itself.
[functions.reply-inbound]
verify_jwt = false

# Colin's "Send contract" (preview, send, new link, withdraw, open a PDF); checks the owner role itself.
[functions.contract]
verify_jwt = true

# The seller's signing page: no login, the link token is the credential (only its hash is stored).
[functions.contract-sign]
verify_jwt = false

# The conveyor (pg_cron every 15 minutes; checks the shared secret itself like send-openers).
[functions.conveyor]
verify_jwt = false

[functions.agent-mcp]
verify_jwt = false

# Twilio's recording callback (X-Twilio-Signature), Voice Intelligence's webhook (ids only: everything is re-read from
